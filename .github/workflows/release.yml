name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
            artifact-name: windows
          - os: macos-latest
            platform: darwin-aarch64
            artifact-name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps

      - name: Build signed installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      - name: Collect Windows artefakts
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artefakts | Out-Null
          Copy-Item "src-tauri\target\release\bundle\nsis\*-setup.exe" -Destination artefakts -Force
          Copy-Item "src-tauri\target\release\bundle\nsis\*-setup.exe.sig" -Destination artefakts -Force

      - name: Collect macOS artefakts
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p artefakts
          cp src-tauri/target/release/bundle/macos/*.app.tar.gz artefakts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/macos/*.app.tar.gz.sig artefakts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/dmg/*.dmg artefakts/ 2>/dev/null || true
          ls -la artefakts/

      - name: Upload artefakts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.artifact-name }}
          path: artefakts/
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (release notes için)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all build artefakts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Build latest.json manifest
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $repo = "${{ github.repository }}"

          # Release notes git tag mesajından
          $notesRaw = git tag -l --format='%(contents)' "v$version"
          if ($notesRaw -is [array]) {
            $notes = ($notesRaw | Where-Object { $_ -ne $null }) -join "`n"
          } else {
            $notes = [string]$notesRaw
          }
          $notes = $notes.Trim()
          if (-not $notes) { $notes = "v$version" }

          $pubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $platforms = [ordered]@{}

          # Windows
          $winExe = Get-ChildItem "dist/build-windows" -Filter "*_${version}_x64-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          $winSig = Get-ChildItem "dist/build-windows" -Filter "*_${version}_x64-setup.exe.sig" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($winExe -and $winSig) {
            $assetName = $winExe.Name -replace ' ', '.'
            $signature = (Get-Content $winSig.FullName -Raw).Trim()
            $platforms['windows-x86_64'] = [ordered]@{
              signature = $signature
              url = "https://github.com/$repo/releases/download/v$version/$assetName"
            }
          }

          # macOS Apple Silicon
          $macTar = Get-ChildItem "dist/build-macos-arm64" -Filter "*.app.tar.gz" -ErrorAction SilentlyContinue | Select-Object -First 1
          $macSig = Get-ChildItem "dist/build-macos-arm64" -Filter "*.app.tar.gz.sig" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($macTar -and $macSig) {
            $assetName = $macTar.Name -replace ' ', '.'
            $signature = (Get-Content $macSig.FullName -Raw).Trim()
            $platforms['darwin-aarch64'] = [ordered]@{
              signature = $signature
              url = "https://github.com/$repo/releases/download/v$version/$assetName"
            }
          }

          $manifest = [ordered]@{
            version = $version
            notes = $notes
            pub_date = $pubDate
            platforms = $platforms
          } | ConvertTo-Json -Depth 10

          New-Item -ItemType Directory -Force -Path release-final | Out-Null
          $manifest | Set-Content -Path "release-final/latest.json" -Encoding UTF8

          # Tüm asset'leri release-final'a kopyala
          Get-ChildItem dist -Recurse -File | Copy-Item -Destination release-final -Force

          Write-Host "Manifest:" -ForegroundColor Green
          Get-Content "release-final/latest.json"
          Write-Host ""
          Write-Host "Release dosyaları:" -ForegroundColor Green
          Get-ChildItem release-final | Select-Object Name, Length

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-final/*
