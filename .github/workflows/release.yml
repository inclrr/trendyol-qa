name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Determine version from tag
        id: ver
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build signed installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      - name: Build latest.json manifest
        id: manifest
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $nsisDir = "src-tauri\target\release\bundle\nsis"
          $exe = Get-ChildItem $nsisDir -Filter "*_${version}_x64-setup.exe" | Select-Object -First 1
          $sig = Get-ChildItem $nsisDir -Filter "*_${version}_x64-setup.exe.sig" | Select-Object -First 1
          if (-not $exe -or -not $sig) {
            throw "Setup veya imza dosyası bulunamadı."
          }
          $signature = (Get-Content $sig.FullName -Raw).Trim()
          $pubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $notes = git tag -l --format='%(contents)' "v$version"
          if (-not $notes) { $notes = "v$version" }
          $url = "https://github.com/${{ github.repository }}/releases/download/v$version/" + [System.Web.HttpUtility]::UrlEncode($exe.Name).Replace('+','%20')

          $manifest = [ordered]@{
            version = $version
            notes = $notes
            pub_date = $pubDate
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                signature = $signature
                url = $url
              }
            }
          } | ConvertTo-Json -Depth 10

          New-Item -ItemType Directory -Force -Path release | Out-Null
          $manifest | Set-Content -Path "release\latest.json" -Encoding UTF8
          Copy-Item $exe.FullName "release\"
          Copy-Item $sig.FullName "release\"
          Write-Host "Hazır artefaktlar:"
          Get-ChildItem release | Select-Object Name, Length

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ''
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.sig
            release/latest.json
